[project]
name = "jobd"
version = "0.1.0"
description = "Cross-session job queue for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.9",
    "httpx>=0.26",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
worker = [
    "httpx>=0.26",
    "psutil>=5.9",
    "pynvml>=11.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
jobd = "jobd.main:run"
job = "job_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobd", "src/job_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
