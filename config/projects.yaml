# Per-project priority table. Higher priority wins when the queue is contended.
# This file is OPTIONAL — with no projects.yaml the broker uses the global
# default priority for every job. Edit freely for your own projects.
#
# WHAT IS IN HERE: every name and path in this file is a PSEUDONYM. The
# `project-a..d` rows are placeholders, and the `alpha`/`beta`/`gamma`/`delta`
# entries with `roots:` mirror the maintainer's fleet with names and home
# directory rewritten, so that CI can replay 3,608 rows of real job history
# (tests/data/project_cwd_corpus.csv, rewritten the same way) through
# tests/test_corpus_replay.py without publishing where anything really lives.
# The real names and roots go in `config/projects.local.yaml` beside this file
# -- gitignored, and read by the broker as an overlay that replaces same-named
# entries and adds new ones (docs/projects-yaml.md, "projects.local.yaml").
# If you cloned jobd to run your own broker: put YOUR projects there, or
# replace the entries below; `docker-compose.yml` bind-mounts ./config.
#
# Change priorities live (persists + reloads) with:
#   job projects set NAME PRIORITY
projects:
  # Tier 1 — time-sensitive / blocking work
  project-a: { priority: 80 }
  project-b: { priority: 75 }

  # `roots:` gives a project a cwd-derived identity for a job whose typed
  # --project is not itself registered (rule 2; see docs/projects-yaml.md).
  # Every root below was picked by replaying tests/data/project_cwd_corpus.csv
  # (3,608 real submits, 249 distinct project/cwd pairs) through
  # `.venv/bin/python -c` grouped by cwd: a directory earned a root only when
  # EVERY project name ever typed from it read as a variant of one project —
  # never a shared scratch path, and never a directory the corpus also shows
  # in the hands of a genuinely different project. `tests/test_corpus_replay.py`
  # replays the same corpus against the resolver these roots feed.
  alpha:
    priority: 80
    roots:
      # 287 jobs across alpha's own tree (backend + worktrees), all typed
      # `alpha` or an `alpha-*`/`phase*` variant. Deliberately NOT
      # including /home/user/trellis2, .../hunyuan3d or .../instantmesh —
      # each is >=97% alpha-typed in the corpus too (trellis2 alone is the
      # single largest cwd in the whole corpus, 1209 jobs), but all three are
      # generic third-party tool checkouts (TRELLIS, Hunyuan3D, InstantMesh);
      # a differently-owned future clone at the same path would silently
      # inherit alpha's identity. Revisit if that risk turns out to be
      # theoretical.
      - /home/user/alpha
  beta:
    priority: 78
    roots:
      # 187 jobs directly in /home/user/beta plus several hundred more
      # in its .claude/worktrees/* and .worktrees/* subdirectories (matched
      # via the same root, component-wise). Typed names are `beta`, the
      # `pillarN...` sweep labels, and a few others (`synthetic-souls`,
      # `ss-1l-emerge`, `beta-2c-*`) that all read as this one project.
      - /home/user/beta
      # 12 jobs, one typed label (`pillar1l-emerge`), unregistered — every one
      # of them falls to _default today. A sibling of the root above (not
      # nested under it, so it needs its own entry), and unlike gamma-data/
      # delta below this one is NOT forward-looking: it recovers
      # real historical jobs today.
      - /home/user/beta-1l-sweep

  # Tier 2 — active development
  project-c:
    priority: 60
    defaults:
      # Per-project submit defaults. preemptible=true lets a higher-priority
      # job pause this one (the worker is sent SIGTERM, then SIGKILL after the
      # grace window) — only safe for jobs that checkpoint. See docs/preemption.md.
      preemptible: true
      checkpoint_grace_s: 60
  gamma:
    priority: 60
    roots:
      # 335 jobs at /home/user/gamma under `gamma` plus a
      # dozen `gamma-*`/`stage*` variants — real historical recovery.
      - /home/user/gamma
      # Forward-looking, not evidence-backed: every one of the 17 jobs here
      # was already typed `gamma` exactly, so this root recovers ZERO
      # historical jobs (rule 1 already handled all of them). Kept because
      # the directory is 17/17 clean for this project — it exists so a
      # future mistyped run from here lands right, not because the corpus
      # needed it.
      - /home/user/gamma-data
  delta:
    priority: 60
    roots:
      # Forward-looking, not evidence-backed: all 18 jobs here were already
      # typed `delta` exactly, so this root recovers ZERO
      # historical jobs (rule 1 already handled all of them). Kept as a
      # safety net for a future mistyped label from this directory.
      - /home/user/delta

  # Tier 3 — background / best-effort
  project-d: { priority: 40 }

  # Priority applied to any project not listed above. The defaults below are the
  # FLEET-WIDE hang-guard: EVERY project inherits them — listed or not — and a
  # project overrides them one key at a time (set idle_timeout_s and you keep
  # max_wall_s). This is a floor, not a fallback.
  #
  # It was a fallback until 2026-07-14, and the difference cost real GPU time:
  # `resolve_project_defaults` did `projects.get(name) or projects.get("_default")`,
  # so the guard reached only projects that were NOT in this file. Registering 32
  # real projects to give them priorities therefore disarmed the hang-guard on all
  # 32 — including project-x, whose zombie is the incident described below. The
  # guard covered exactly the projects nobody had configured. See
  # tests/test_project_defaults_floor.py.
  #
  # idle_timeout_s reaps a job that emits NO output for 1h and frees its slot — this
  # prevents D-state/9p-stall zombies (a real incident: a silent job held a
  # desktop GPU slot for 6 days). 1h is generous: a true hang is silent forever
  # so it is caught regardless, while a healthy job printing periodic progress is
  # never killed. A legitimately-silent long job should emit a heartbeat, or set
  # a larger per-project idle_timeout_s.
  #
  # This lived only as an uncommitted edit on the broker-host broker until 2026-07-12 —
  # i.e. one `git clone` away from being silently lost. It is config-as-code, so
  # it belongs here.
  _default:
    priority: 40
    defaults:
      idle_timeout_s: 3600 # 1h with no stdout -> reap + free the slot
      max_wall_s: 172800 # 48h hard runaway ceiling
